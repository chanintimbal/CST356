<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2</title>

    <style>
        .header {
            font-family: "Times New Roman", sans-serif;
            text-align: center;
        }

        .formstyle {
            font-family: "Times New Roman", sans-serif;
            background-color: #bddbe5;
            padding: 20px;
            border-radius: 5px;
            width: 380px;
            margin: auto;
        }

        input[type="number"], select, textarea {
            font-family: "Times New Roman", sans-serif;
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="text"], select, textarea, input {
            font-family: "Times New Roman", sans-serif;
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 100%;
            background-color: #4c99af;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 24px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <div>
        <h1 class="header">Lab 2 - Chanin Timbal</h1>
    </div>

<form class="formstyle" action="https://otapp-cstwebdev.azurewebsites.net/" method="post">

    <label for="StudentID">Student ID:</label>
    <input type="text" id="StudentID" name="StudentID" maxlength="9">
    <br>

    <label for="Name">Name:</label>
    <input type="text" id="Name" name="Name" placeholder="First Last">
    <br>

    <label for="GraduationDate">Graduation Date:</label>
    <input type="date" id="GraduationDate" name="GraduationDate">
    <br>

    <label for="EmailAddress">Email Address:</label>
    <input type="email" id="EmailAddress" name="EmailAddress" placeholder="example@university.edu">
    <br>

    <label for="Age">Age:</label>
    <input type="number" id="Age" name="Age" min="0" max="100">
    <br>

    <label for="Hobby">Hobby:</label>
    <input type="text" id="Hobby" name="Hobby">
    <br>

    <label for="UserType">User Type:</label>
    <select id="UserType" name="UserType">
        <option value="Student">Student</option>
        <option value="Faculty/Staff">Faculty/Staff</option>
    </select>
    <br>

    <label for="Band">Favorite Band:</label>
    <input type="text" id="Band" name="Band">
    <br>

    <label for="Biography">Biography:</label>
    <textarea id="Biography" name="Biography" rows="4" cols="50"></textarea>
    <br>

    <input type="hidden" name="SuperSecretText" value="Alright then, keep your secrets.">

    <input type="submit" value="Submit">

</form>
</body>

</html>
